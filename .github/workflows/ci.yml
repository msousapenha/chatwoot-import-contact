name: Build and Push Docker Image

on:
  push:
    branches:
      - main # ou master, dependendo de como está o seu repositório

env:
  REGISTRY: ghcr.io
  # O nome da imagem será: ghcr.io/seu-usuario/nome-do-repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permissão essencial para publicar no GHCR

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Log in no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # O GitHub gera esse token automaticamente

      - name: Extrair metadados (tags, labels) para o Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha # Gera uma tag com o hash do commit também

      - name: Build and push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}